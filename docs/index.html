<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f1d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Twelve Rounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Fight night under the house lights: arena ink, ring-canvas cream, red and blue corners, title-belt gold.
   One deliberate dark theme. Layout: one column folded, two panes unfolded, fight HUD over the canvas with thumb clusters at the bottom corners. */
:root{
  --ink:#0d0f1d; --ink2:#141831; --panel:#1a1f38; --panel2:#242b4a; --line:#353d63; --line2:#4a5384;
  --text:#f4efe3; --muted:#a0a7c6; --dim:#6c7396;
  --canvas:#ebe3cf; --canvas-ink:#1f1b13;
  --red:#d8392f; --red2:#a8231c; --blue:#2f6fe2; --blue2:#1f4ea8; --gold:#f0be48; --gold2:#b8862a;
  --good:#4fca8e; --bad:#f05a55; --warn:#f2a53c;
  --f-display:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --f-ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ---------- type ---------- */
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.02;text-wrap:balance}
.ui{font-family:var(--f-ui)}
.lbl{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .goldt{color:var(--gold)} .warnt{color:var(--warn)}
h1,h2,h3{margin:0}
h2.sec{font-family:var(--f-ui);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.08em;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-height:46px;color:var(--text);transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--red);border-color:var(--red2);box-shadow:0 3px 0 var(--red2)}
.btn.gold{background:var(--gold);color:#23190a;border-color:var(--gold2);box-shadow:0 3px 0 var(--gold2)}
.btn.blue{background:var(--blue);border-color:var(--blue2);box-shadow:0 3px 0 var(--blue2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.col>.pill,.card.col>.pill{align-self:flex-start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}

/* ---------- screens ---------- */
.scr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:var(--ink2)}
.card h3{font-family:var(--f-ui);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.gold{background:#3a2d0c;border-color:var(--gold2);color:var(--gold)}
.pill.red{background:#3a1312;border-color:var(--red2);color:#ff8a80}
.pill.blue{background:#0f2147;border-color:var(--blue2);color:#8fb6ff}
.pill.green{background:#0f3324;border-color:#2b7a55;color:var(--good)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.topbar .t{font-family:var(--f-ui);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.05em;flex:1;min-width:0}
.back{min-width:44px}

/* shell: two panes when unfolded */
.shell{flex:1;min-height:0;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
@media (min-width:680px){
  .shell.two .side{display:flex;flex-direction:column;gap:12px;width:300px;flex:none;border-right:1px solid var(--line);background:var(--ink2);overflow-y:auto;
    padding:16px 14px 24px max(14px,env(safe-area-inset-left,0px))}
  .shell.two .main .scr{padding-left:20px}
  .shell.two .only-narrow{display:none!important}
}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.side .nav{grid-template-columns:1fr 1fr}
.navb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:56px;position:relative}
.navb b{font-family:var(--f-ui);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.navb small{color:var(--muted);font-size:12px}
.navb.on{border-color:var(--gold);background:#2a2614}
.navb .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}

/* profile */
.prof{display:flex;gap:12px;align-items:center}
.prof img{width:72px;height:72px;border-radius:10px;background:var(--panel2);flex:none}
.prof .nm{font-family:var(--f-display);font-size:22px;line-height:1.05}
.prof .nk{font-family:var(--f-ui);font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.rec{font-family:var(--f-ui);font-weight:800;font-size:20px;letter-spacing:.03em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.08em;font-size:12px;align-self:center}
.kv dd{margin:0;font-weight:600}
.belts{display:flex;gap:6px;flex-wrap:wrap}
.belt{font-family:var(--f-ui);font-weight:800;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:4px;color:#1b1406;background:linear-gradient(180deg,#ffe29a,var(--gold) 45%,var(--gold2));border:1px solid #6d4f14}

/* stat bars */
.stat{display:grid;grid-template-columns:92px 1fr 34px auto;gap:8px;align-items:center}
.stat .n{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.bar{height:10px;background:var(--ink);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6aa0ff)}
.bar.r i{background:linear-gradient(90deg,var(--red2),var(--red))}
.bar.g i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.plus{width:34px;height:34px;min-height:34px;padding:0;border-radius:6px;font-size:20px}

/* hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 0%,#2b3462 0%,var(--ink2) 60%,var(--ink) 100%)}
.hero .in{position:relative;padding:18px;display:flex;flex-direction:column;gap:10px}
.kicker{font-family:var(--f-ui);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--gold)}

/* offers */
.offer{display:flex;flex-direction:column;gap:10px}
.vs{display:flex;gap:12px;align-items:center}
.vs img{width:56px;height:56px;border-radius:8px;background:var(--panel2);flex:none}
.vs .on{font-family:var(--f-display);font-size:19px;line-height:1.05}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}

/* tables */
.tblw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid #262c4a;font-variant-numeric:tabular-nums}
table.t tr.me td{background:#2a2614;color:var(--gold)}
table.t td.r,table.t th.r{text-align:right}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font:inherit;font-size:16px;min-height:44px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;min-height:42px}
.chip.on{border-color:var(--gold);background:#2a2614;color:var(--gold)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);padding:0;min-height:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--ink) inset}
.arch{text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--panel)}
.arch.on{border-color:var(--gold);background:#272414}
.arch b{font-family:var(--f-ui);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:17px}
.arch small{color:var(--muted)}

/* skill tree */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.tree{grid-template-columns:1fr}}
.branch{display:flex;flex-direction:column;gap:8px}
.branch h4{margin:0;font-family:var(--f-ui);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:15px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.sk{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.sk b{font-family:var(--f-ui);font-weight:800;font-size:15px;letter-spacing:.03em}
.sk small{color:var(--muted);font-size:12.5px;line-height:1.3}
.sk.own{border-color:#2b7a55;background:#10291f}
.sk.can{border-color:var(--gold)}
.sk.lock{opacity:.45}
.sk .tier{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.78);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadein .18s ease-out}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:520px;width:100%;max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a}
.modal .box.wide{max-width:760px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-family:var(--f-ui);font-weight:700;letter-spacing:.05em;max-width:90vw;text-align:center}

/* title screen */
.title-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 6px;text-align:center}
.logo{font-family:var(--f-display);font-size:clamp(46px,13vw,96px);line-height:.9;color:var(--canvas);text-shadow:0 4px 0 var(--red2),0 8px 24px #000}
.logo span{display:block;color:var(--gold);font-size:.52em;letter-spacing:.08em}
.slot{display:flex;gap:12px;align-items:center}
.slot img{width:58px;height:58px;border-radius:8px;background:var(--panel2)}

/* ---------- FIGHT ---------- */
.fight{--bs:1;position:fixed;inset:0;z-index:20;background:#05060c;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);touch-action:none}
.fhud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;padding:6px 10px 6px;background:linear-gradient(180deg,#000c,#0000)}
.hb{display:flex;flex-direction:column;gap:3px;min-width:0}
.hb.o{align-items:flex-end;text-align:right}
.hb .nm{font-family:var(--f-ui);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fbar{position:relative;height:12px;width:100%;background:#1a0e10;border:1px solid #000;border-radius:3px;overflow:hidden}
.fbar .mx{position:absolute;inset:0 auto 0 0;background:#3a2326}
.fbar .v{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#ff6a5c,var(--red))}
.hb.o .fbar .mx,.hb.o .fbar .v{left:auto;right:0}
.fbar.st{height:7px;background:#0d1426}
.fbar.st .mx{background:#1d2a4a}
.fbar.st .v{background:linear-gradient(180deg,#7fb0ff,var(--blue))}
.hb.p .fbar .v{background:linear-gradient(180deg,#ffd36b,#e9a92c)}
.clock{text-align:center;font-family:var(--f-ui);font-weight:800;line-height:1}
.clock .tm{font-size:26px;font-variant-numeric:tabular-nums}
.clock .rd{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.pz{background:#fff1;border:1px solid #fff3;border-radius:6px;min-height:28px;padding:2px 10px;font-family:var(--f-ui);font-weight:800;font-size:12px;letter-spacing:.1em;margin-top:4px}
.fstage{position:relative;min-height:0;overflow:hidden}
.fstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fctl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 10px 10px;background:linear-gradient(0deg,#000,#0000)}
.cl{display:grid;gap:7px;width:min(49%,330px)}
.cl.def{grid-template-columns:repeat(3,1fr)}
.cl.off{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.fb{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;border:0;border-radius:12px;color:#fff;
  font-family:var(--f-ui);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(13px,3.7vw,19px);
  min-height:calc(clamp(46px,7.6vh,76px)*var(--bs,1));padding:4px;line-height:1.05;
  background:linear-gradient(180deg,#3b4370,#262c4c);box-shadow:inset 0 -4px 0 #0007,0 1px 0 #fff2 inset}
.fb.punch{background:linear-gradient(180deg,#e2463b,#a3241d)}
.fb.dodge{background:linear-gradient(180deg,#3b78e8,#1e489c)}
.fb.guard{background:linear-gradient(180deg,#4c5684,#2b3258)}
.fb.body{background:linear-gradient(180deg,#5a4a1f,#3a2f12);color:var(--gold);min-height:clamp(34px,5vh,50px);font-size:clamp(12px,3.2vw,16px)}
.fb.body.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1d1406}
.fb.clinch{background:linear-gradient(180deg,#58607f,#383f5d);font-size:clamp(11px,3.1vw,16px)}
.fb.spc{background:linear-gradient(180deg,#3a3320,#221d10);color:var(--gold);font-size:clamp(10px,2.9vw,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.fb.spc.ready{background:linear-gradient(180deg,#f6c95a,#c48d22);color:#1d1406;animation:glow 1s ease-in-out infinite alternate}
.fb.spc.empty{opacity:.5}
.fb .pips{display:flex;gap:3px}.fb .pips i{width:9px;height:5px;border-radius:2px;background:#0006}.fb .pips i.f{background:currentColor}
.fb.on{transform:translateY(2px);filter:brightness(1.25);box-shadow:inset 0 -1px 0 #0007}
.fb small{display:block;font-size:.62em;opacity:.8;letter-spacing:.04em}
@keyframes glow{from{box-shadow:0 0 0 #f0be4800,inset 0 -4px 0 #0005}to{box-shadow:0 0 16px #f0be48aa,inset 0 -4px 0 #0005}}
/* flex mode (half-folded): ring on the top segment, controls on the bottom */
@media (vertical-viewport-segments:2){
  .fight{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:1fr}
  .fstage{height:calc(env(viewport-segment-bottom 0 0) - 70px)}
  .fctl{display:flex;min-height:calc(100vh - env(viewport-segment-top 0 1));align-items:center;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
  .fb{min-height:calc(clamp(56px,9vh,90px)*var(--bs,1))}
}
/* wide or landscape: thumbs on either side of the ring */
@media (min-aspect-ratio:5/4) and (not (vertical-viewport-segments:2)){
  .fight{grid-template-columns:minmax(150px,24%) minmax(0,1fr) minmax(150px,24%);grid-template-rows:auto minmax(0,1fr)}
  .fhud{grid-column:1/-1}
  .fstage{grid-column:2;grid-row:2}
  .fctl{display:contents}
  .cl{width:auto;align-self:end;padding:10px}
  .cl.def{grid-column:1;grid-row:2}
  .cl.off{grid-column:3;grid-row:2}
  .fb{min-height:clamp(46px,11vh,80px)}
}
.fov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:5;pointer-events:none;text-align:center}
.fov.act{pointer-events:auto}
.bigtxt{font-family:var(--f-display);font-size:clamp(40px,12vw,90px);color:var(--canvas);text-shadow:0 4px 0 var(--red2),0 6px 20px #000}
.getup{pointer-events:auto;width:min(80%,360px);min-height:120px;font-size:34px;border-radius:18px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;border:0;font-family:var(--f-display);box-shadow:0 6px 0 #6d4f14}
.gbar{width:min(80%,360px);height:16px;border-radius:8px;background:#0008;border:1px solid #fff3;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.corner{position:absolute;inset:0;z-index:8;background:rgba(5,6,14,.86);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.corner .box{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:16px}
.copt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.copt.on{border-color:var(--gold);background:#2a2614}
.copt b{font-family:var(--f-ui);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.copt small{color:var(--muted)}
.quote{border-left:3px solid var(--gold);padding:6px 0 6px 12px;font-style:italic}

/* minigames */
.mg{position:fixed;inset:0;z-index:20;background:#07080f;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);touch-action:none}

/* ---- seeded RNG: every random call goes through RNG.cur so fights and careers replay exactly ---- */
class Rng{
  constructor(seed){this.s=(seed>>>0)||1}
  next(){let a=this.s=(this.s+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
  int(){return (this.s=(this.s+0x6D2B79F5)|0)>>>0}
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const RNG={
  cur:null,
  use(r){const p=this.cur;this.cur=r;return p},
  with(r,fn){const p=this.cur;this.cur=r;try{return fn()}finally{this.cur=p}},
  seed(){return (Math.random()*4294967296)>>>0},
};
const R=()=>RNG.cur?RNG.cur.next():Math.random();
const rand=(a,b)=>a+R()*(b-a);
const randi=(a,b)=>Math.floor(a+R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const chance=p=>R()<p;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const wpick=obj=>{let t=0;for(const k in obj)t+=Math.max(0,obj[k]);let r=R()*t;for(const k in obj){r-=Math.max(0,obj[k]);if(r<=0)return k}return Object.keys(obj)[0]};

const Sfx={
  ctx:null,out:null,nb:null,crowd:null,crowdGain:null,
  init(){
    if(this.ctx){if(this.ctx.state!=='running')this.ctx.resume().catch(()=>{});return}
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      this.ctx=new C();
      this.out=this.ctx.createGain();this.out.gain.value=.8;
      const comp=this.ctx.createDynamicsCompressor();this.out.connect(comp);comp.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2,b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.nb=b;
    }catch(e){this.ctx=null}
  },
  ok(){return Settings.sound&&this.ctx&&this.ctx.state==='running'},
  noise(dur,{type='lowpass',f=1000,f2=null,q=1,g=.5,att=.004,delay=0}={}){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay;
    const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
    const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;

    s.connect(fl);fl.connect(gn);gn.connect(this.out);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
  },
  tone(f,dur,{type='sine',g=.3,f2=null,att=.005,delay=0}={}){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay;
    const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const gn=c.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+att);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn);gn.connect(this.out);o.start(t);o.stop(t+dur+.05);
  },
  hit(power=1,body=false){const p=Math.min(power,1.6);this.noise(.08+.05*p,{f:body?520:1500,f2:body?140:280,g:.45+.3*p});this.tone(body?68:96,.15+.08*p,{f2:38,g:.42*p+.1})},
  block(){this.noise(.07,{type:'bandpass',f:900,q:1.4,g:.32});this.tone(170,.07,{g:.12,f2:90})},
  whoosh(){this.noise(.18,{type:'bandpass',f:500,f2:2400,q:2,g:.12,att:.05})},
  /* audio tells: one voice per punch type so you can play by ear */
  tell(type,dur){
    if(!Settings.audioTells)return;
    const d=Math.min(.5,Math.max(.12,dur*.8));
    if(type==='jab'){this.noise(d*.6,{type:'bandpass',f:1800,f2:2600,q:3,g:.08,att:.02})}
    else if(type==='cross'){this.tone(180,d,{type:'sawtooth',g:.06,f2:120,att:.03});this.noise(d,{type:'bandpass',f:700,f2:1600,q:2,g:.09,att:.04})}

  },
  flash(){if(!Settings.audioTells)return;this.tone(2200,.07,{type:'sine',g:.07});this.tone(3300,.09,{type:'sine',g:.05,delay:.03})},
  bell(n=1){for(let i=0;i<n;i++){const d=i*.32;[1,2.76,5.4].forEach((m,j)=>this.tone(880*m,1.3-j*.3,{g:.16/(j+1),delay:d}))}},
  tick(){this.tone(1200,.04,{g:.05,type:'square'})},
  count(){this.tone(210,.2,{g:.22,type:'triangle'});this.noise(.08,{type:'highpass',f:2000,g:.05})},
  crowdStart(){
    if(!this.ok()||this.crowd)return;const c=this.ctx;
    const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=.5;
    const g=c.createGain();g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.045,c.currentTime+1.2);

  },
  roar(a=.22,dur=1.8){if(!this.crowdGain||!this.ok())return;const t=this.ctx.currentTime,g=this.crowdGain.gain;g.cancelScheduledValues(t);g.setValueAtTime(Math.max(.0001,g.value),t);g.linearRampToValueAtTime(a,t+.12);g.linearRampToValueAtTime(.045,t+dur)},
  crowdStop(){if(this.crowd){try{this.crowd.stop()}catch(e){}this.crowd=null;this.crowdGain=null}},

const START_YEAR=2027;
const SAVE_V=1;
let G=null;
/* RNG streams live in G so a reloaded career keeps rolling the same dice */
function careerRng(){if(!G)return null;if(!G._rng)G._rng={career:new Rng(G.rng?.career??G.seed),world:new Rng(G.rng?.world??(G.seed^0x5bd1e995))};return G._rng}
function syncRng(){if(G&&G._rng)G.rng={career:G._rng.career.s,world:G._rng.world.s}}
function useCareerRng(){const r=careerRng();RNG.cur=r?r.career:null}

const B=()=>G.boxer;
function ageOf(born){return Math.floor((G.week-born)/52)}
function dateStr(w){w=w??G.week;const y=START_YEAR+Math.floor(w/52);const m=Math.min(11,Math.floor((w%52)/52*12));return MONTHS[m]+' '+y}
function fullName(f){return f.nick?`${f.first} “${f.nick}” ${f.last}`:`${f.first} ${f.last}`}
function shortName(f){return `${f.first} ${f.last}`}
function recStr(f){return `${f.w}-${f.l}${f.d?'-'+f.d:''}`}
function randomLook(){return {skin:randi(0,SKIN.length-1),hair:pick(HAIRS),hc:chance(.8)?randi(0,2):randi(0,HAIRC.length-1),beard:chance(.6)?'none':pick(BEARDS),trunks:pick(COLORS),trim:pick(COLORS),gloves:chance(.5)?'#d8392f':pick(COLORS)}}

function ovr(s){return Math.round((s.pow*1.1+s.spd*1.1+s.sta+s.chin+s.def+s.foot*.9+s.iq*.9)/7)}
function statsFromRating(r,arch){const base=ARCH[arch].base,s={};for(const k of STAT_KEYS)s[k]=clamp(Math.round(r+(base[k]-47)*.8+rand(-4,4)),15,99);return s}

/* ---------- world ---------- */
function makeFighter(div,rating,age,o={}){
  const arch=o.arch||pick(Object.keys(ARCH));
  const h=[63,65,66,68,70,72,74,76][div]+randi(-2,2);
  const f={id:'f'+uid(),first:o.first||pick(FIRST),last:o.last||pick(LAST),nick:o.nick!==undefined?o.nick:(chance(.55)?pick(NICKS):''),
    home:o.home||pick(HOMES),div,arch,rating:Math.round(clamp(rating,25,99)),born:G.week-age*52-randi(0,51),w:0,l:0,d:0,ko:0,pts:0,
    look:o.look||randomLook(),stance:o.southpaw?'southpaw':(chance(.18)?'southpaw':'orthodox'),height:h,reach:h+randi(-1,4)+(o.reach||0),
    legend:o.legend||null,active:true,pot:o.pot||Math.round(clamp(rating+rand(0,18),40,97))};
  const n=clamp(Math.round((age-19)*2.3+rand(-3,3)),0,55);
  const wp=clamp(.3+f.rating/150+rand(-.08,.08),.3,1);
  f.w=Math.round(n*wp);f.l=n-f.w;f.d=chance(.25)?randi(0,2):0;
  f.ko=Math.round(f.w*(arch==='slugger'?.75:arch==='swarmer'?.6:.45));
  if(f.legend&&f.l>3)f.l=randi(0,2);
  f.pts=Math.round(clamp(f.rating*10-180+(f.w-f.l)*3+rand(-40,40),20,1000));
  return f;
}
function legendFighter(L){
  const look={skin:L.skin,hair:L.hair,hc:L.hc||0,beard:L.beard||'none',trunks:L.trunks,trim:'#f4efe3',gloves:L.trunks==='#d8392f'?'#f4efe3':'#d8392f'};
  const f=makeFighter(L.div,L.rating,L.age,{first:L.first,last:L.last,nick:L.nick,home:L.home,arch:L.arch,look,southpaw:L.southpaw,reach:L.reach||0,legend:L.id,pot:L.rating});
  f.pts=Math.round(clamp(f.rating*10-120+rand(0,40),600,1000));
  return f;
}
function genWorld(){
  const W={f:{},divs:[],champs:[]};
  for(let d=0;d<8;d++){
    const ids=[];
    const add=f=>{W.f[f.id]=f;ids.push(f.id)};
    LEGENDS.filter(l=>l.div===d).forEach(l=>add(legendFighter(l)));
    const tiers=[[2,85,91],[6,75,85],[10,63,75],[18,40,63]];
    for(const [n,a,b] of tiers)for(let i=0;i<n;i++)add(makeFighter(d,rand(a,b),randi(20,35)));
    W.divs.push(ids);
  }
  G.world=W;
  for(let d=0;d<8;d++)assignChamps(d,true);
}
function divFighters(d){return G.world.divs[d].map(id=>G.world.f[id]).filter(f=>f&&f.active)}
function assignChamps(d,init){
  const list=divFighters(d).sort((a,b)=>b.pts-a.pts);
  const ch=G.world.champs[d]||{};
  BODIES.forEach((bd,i)=>{
    if(init||!ch[bd.k]||(ch[bd.k]!=='P'&&!G.world.f[ch[bd.k]]?.active)||(ch[bd.k]!=='P'&&G.world.f[ch[bd.k]]?.div!==d)){
      const taken=new Set(Object.values(ch));
      let c=list[init?(i%3):0];
      if(!init)c=list.find(f=>!taken.has(f.id))||list[0];
      if(init&&i===3&&chance(.5))c=list[0];
      ch[bd.k]=c?c.id:null;
    }
  });
  G.world.champs[d]=ch;
}
function beltsOf(id,d){const ch=G.world.champs[d]||{};return BODIES.filter(b=>ch[b.k]===id).map(b=>b.k)}
function playerBelts(){const out=[];for(let d=0;d<8;d++)beltsOf('P',d).forEach(k=>out.push({k,d}));return out}
function ranking(d){
  const list=divFighters(d).map(f=>({id:f.id,pts:f.pts,f}));
  if(G.phase==='pro'&&B().div===d)list.push({id:'P',pts:B().pts,f:null});
  list.sort((a,b)=>b.pts-a.pts);
  return list;
}
function playerRank(){if(G.phase!=='pro')return null;const r=ranking(B().div).findIndex(e=>e.id==='P');return r<0?null:r+1}
function rankOf(id,d){const r=ranking(d).findIndex(e=>e.id===id);return r+1}

/* ---------- player stats ---------- */
function skillMods(){
  const m={};for(const id of B().skills){const s=SKILLS.find(x=>x.id===id);if(s&&s.mods)for(const k in s.mods)m[k]=(m[k]||0)+s.mods[k]}
  return m;
}
function weightInfo(div){
  const b=B();div=div??b.div;const d=div-b.natural;
  const red=Math.min(.8,(G.staff.nutri?.4:0)+(skillMods().cut||0)+(G.next?.cutWork||0)*.2);
  const T={
    '-2':{pow:1.12,chin:1.1,spd:1,sta:.74,miss:.25,label:'Brutal weight cut',tone:'bad',note:'Much bigger than them, but drained on fight night.'},
    '-1':{pow:1.06,chin:1.05,spd:1,sta:.9,miss:.06,label:'Weight cut',tone:'warn',note:'Size advantage, slight stamina cost.'},
    '0':{pow:1,chin:1,spd:1,sta:1,miss:0,label:'Natural weight',tone:'good',note:'No penalties.'},
    '1':{pow:.92,chin:.92,spd:1.06,sta:1.04,miss:0,label:'Moved up',tone:'warn',note:'Faster than them, but they hit harder.'},
    '2':{pow:.84,chin:.84,spd:1.1,sta:1.06,miss:0,label:'Way above natural',tone:'bad',note:'Fighting much bigger men.'},
  }[String(d)];
  if(!T)return null;
  const r=Object.assign({},T);
  if(r.sta<1)r.sta=1-(1-r.sta)*(1-red);
  r.miss*=(1-red);r.diff=d;
  return r;
}
function effectiveStats(){
  const b=B(),s=Object.assign({},b.stats),w=weightInfo()||{pow:1,chin:1,spd:1,sta:1};
  s.pow*=w.pow;s.chin*=w.chin;s.spd*=w.spd;s.sta*=w.sta;
  s.chin-=b.damage*.22;
  for(const inj of b.injuries){const e=INJ[inj.id].eff;for(const k in e)if(s[k]!=null)s[k]*=e[k]}
  for(const k of STAT_KEYS)s[k]=clamp(Math.round(s[k]),10,110);
  return s;
}
function playerOvr(){return ovr(B().stats)}
function xpNeed(l){return 150+l*80}
function addXP(n){
  const b=B();let ups=0;b.xp+=Math.round(n);
  while(b.level<60&&b.xp>=xpNeed(b.level)){b.xp-=xpNeed(b.level);b.level++;ups++;b.statPts+=3;b.skillPts+=1+(b.level%5===0?1:0)}
  return ups;
}
function gainStat(k,n){const b=B();const before=b.stats[k];b.stats[k]=clamp(b.stats[k]+n,1,99);return b.stats[k]-before}
function hasAbility(id){return B().abilities.includes(id)}
function unlockAbility(id,why){const b=B();if(b.abilities.includes(id))return false;b.abilities.push(id);if(b.equipped.length<slotsCount())b.equipped.push(id);news(`New ability: ${AB[id].name}${why?' ('+why+')':''}.`,'gold');return true}
function slotsCount(){return B().level>=15?3:2}

/* ---------- new career ---------- */

    boxer:null,world:null,rival:null,promoter:null,trainer:'pops',gym:'basement',staff:{cutman:false,nutri:false},
    offers:[],next:null,newsList:[],flags:{},chapters:[],history:[],am:{stage:0,round:0,opps:[],results:[]},pending:[],seen:{}};
  useCareerRng();
  const base=ARCH[o.arch].base,stats={};for(const k of STAT_KEYS)stats[k]=base[k];
  const natural=clamp(Math.round((o.height-62)/2+BUILDS[o.build].off),0,7);
  G.boxer={name:o.name,first:o.first,last:o.last,nick:o.nick,home:o.home,stance:o.stance,look:o.look,height:o.height,build:o.build,
    reach:o.height+ARMS[o.arms].d,arch:o.arch,born:-(o.age*52)-randi(0,40),natural,div:natural,stats,level:1,xp:0,statPts:0,skillPts:1,
    skills:[],abilities:[ARCH[o.arch].ability],equipped:[ARCH[o.arch].ability],damage:0,injuries:[],hype:5,money:1500,pts:0,
    record:{w:0,l:0,d:0,ko:0},am:{w:0,l:0},form:[],streak:0,legendsBeaten:[],regional:null,formerChamp:false,titleWins:0,defenses:0,undisputed:0,titleDivs:[],retired:false};
  genWorld();
  const rv=makeFighter(natural,Math.max(40,playerOvr()+1),o.age,{arch:counterArch(o.arch)});
  rv.rival=true;rv.pts=60;rv.w=rv.l=rv.d=rv.ko=0;rv.pro=false;rv.edge=rand(0,4);

function counterArch(a){return {outboxer:'swarmer',slugger:'counter',swarmer:'outboxer',counter:'slugger',boxerpuncher:pick(['slugger','swarmer','counter'])}[a]}
function rivalF(){return G.rival?G.world.f[G.rival.id]:null}

/* ---------- news ---------- */
function news(t,tone){G.newsList.unshift({w:G.week,t,tone:tone||''});if(G.newsList.length>80)G.newsList.length=80}

/* ---------- amateurs ---------- */
const AM_TOURNEYS=[

/* ---------- momentum & matchmaking ---------- */
function momentum(){
  const f=B().form.slice(-4);let m=0;
  f.forEach((r,i)=>{const w=.6+.4*((i+1)/f.length);m+=({WKO:1.6,W:1,D:0,L:-1.5,LKO:-2}[r]||0)*w});
  return m;
}
function momentumLabel(m){return m>=3.5?'Red hot':m>=2?'On a roll':m>=.5?'Building':m>-.5?'Steady':m>-2?'Needs a win':'Must prove it'}
function venueFor(pts){let v=VENUES[0];for(const x of VENUES)if(pts>=x.min)v=x;return v}
function purseFor(opp,type,rounds){
  const b=B();const top=Math.max(b.pts,opp?opp.pts:0);
  let p=700+Math.pow(top/100,2.25)*850;
  p*=1+b.hype/110;p*=.7+rounds*.05;
  if(opp?.legend)p*=1.5;
  p*={world:8,unify:11,regional:2,grudge:1.6,rematch:1.4,chapter:2}[type]||1;
  if(G.promoter)p*=PROMOTERS[G.promoter.id].purse;
  return Math.round(p/100)*100;
}
function roundsFor(type){
  const n=B().record.w+B().record.l+B().record.d;
  if(type==='world'||type==='unify'||type==='chapter')return 12;
  if(type==='regional')return 10;
  return n<4?4:n<8?6:n<13?8:10;
}
function pickOpp(target,used,d){
  const list=divFighters(d).filter(f=>!used.has(f.id)&&!f.amateur&&f.pro!==false);
  if(!list.length)return null;
  list.sort((a,b)=>Math.abs(a.pts-target)-Math.abs(b.pts-target));
  const f=pick(list.slice(0,3));used.add(f.id);return f;
}
function mkOffer(f,type,label,desc,extra={}){
  if(!f)return null;
  const rounds=extra.rounds||roundsFor(type);
  return Object.assign({id:'o'+uid(),oppId:f.id,type,label,desc,rounds,purse:purseFor(f,type,rounds),weeks:extra.weeks||({tuneup:5,prove:5,level:6,stepup:7,regional:8,world:9,unify:9,grudge:8,rematch:8,chapter:9,defense:8}[type]||6),venue:venueFor(Math.max(B().pts,f.pts)).name},extra);
}
function genOffers(){
  const b=B(),d=b.div,me=b.pts,mom=momentum(),pr=G.promoter?PROMOTERS[G.promoter.id]:null,rank=playerRank()||99;
  const used=new Set(),offers=[];
  const last=G.history.filter(h=>h.pro).slice(-1)[0];
  if(last)used.add(last.oppId);
  const rv=rivalF();
  if(rv)used.add(rv.id);
  const myBelts=beltsOf('P',d);
  // chapters first
  for(const ch of CHAPTERS){if(ch.offer&&!G.chapters.includes(ch.id)&&!G.flags['ch_'+ch.id+'_off']){const o=ch.offer();if(o){o.chapter=ch.id;offers.push(o);used.add(o.oppId);break}}}
  if(myBelts.length){
    const cont=ranking(d).filter(e=>e.id!=='P'&&!beltsOf(e.id,d).length);
    const mand=cont[0]?.f;if(mand&&!used.has(mand.id)){used.add(mand.id);offers.push(mkOffer(mand,'world','Mandatory Title Defense',`The ${myBelts.join(', ')} ordered this one. Your #1 contender.`,{title:{belts:myBelts.slice(),defense:true}}))}
    const vol=cont.slice(3,9);const v=vol.length?pick(vol).f:null;
    if(v&&!used.has(v.id)){used.add(v.id);offers.push(mkOffer(v,'world','Voluntary Defense','A softer defense that keeps the belts busy.',{title:{belts:myBelts.slice(),defense:true}}))}
    const other=BODIES.map(x=>G.world.champs[d][x.k]).filter(id=>id&&id!=='P');
    if(other.length){const oc=G.world.f[pick(other)];if(oc&&!used.has(oc.id)){used.add(oc.id);const ob=beltsOf(oc.id,d);offers.push(mkOffer(oc,'unify','Unification Bout',`Your ${myBelts.join(', ')} against their ${ob.join(', ')}. Winner takes everything.`,{title:{belts:[...myBelts,...ob],unify:true}}))}}
  }else{
    if(mom<0)offers.push(mkOffer(pickOpp(me-110,used,d),'prove','Prove-It Fight','Coming off a loss. Nobody gives you a big fight until you show you still belong.'));
    else offers.push(mkOffer(pickOpp(me-90,used,d),'tuneup','Tune-Up','A winnable fight to stay busy and sharp.'));
    offers.push(mkOffer(pickOpp(me+(mom>=2?60:mom>=0?25:-50),used,d),'level','Matched Fight','An even fight at your level.'));
    if(mom>=.5||b.record.w>=3){
      const jump=(mom>=3.5?260:mom>=2?170:110)*(pr?pr.step:1);
      offers.push(mkOffer(pickOpp(me+jump,used,d),'stepup',mom>=3.5?'Fast-Track Fight':'Step-Up Fight',mom>=3.5?'Your streak has the whole division talking. A win here skips you up the ladder.':'A bigger name and a bigger purse. Win and you jump the rankings.'));
    }
    const titleOK=(rank<=3)||(rank<=6&&mom>=2)||(pr&&pr.title>=1.5&&rank<=10&&mom>=1.5);
    if(titleOK){
      const champs=BODIES.map(x=>({k:x.k,id:G.world.champs[d][x.k]})).filter(x=>x.id&&x.id!=='P');
      if(champs.length){const c=pick(champs);const cf=G.world.f[c.id];if(cf&&!used.has(cf.id)){used.add(cf.id);const bl=beltsOf(cf.id,d);offers.unshift(mkOffer(cf,'world',rank<=3?'Mandatory Title Shot':'World Title Shot',`For the ${bl.join(' & ')} ${DIVS[d].name} title${bl.length>1?'s':''}.`,{title:{belts:bl}}))}}
    }
    if(!b.regional&&me>=280&&rank>8&&b.record.w>=5){
      const f=pickOpp(me+60,used,d);if(f)offers.push(mkOffer(f,'regional','Continental Title',`For the vacant Continental ${DIVS[d].name} belt. A regional title gets you noticed.`,{title:{regional:true}}));
    }
  }
  if(rv&&rv.active&&rv.div===d&&G.week-G.rival.lastMet>30&&b.record.w>=4&&Math.abs(rv.pts-me)<260){
    const bl=beltsOf(rv.id,d);
    offers.push(mkOffer(rv,bl.length?'world':'grudge',G.rival.met?'Grudge Rematch':'Grudge Match',`${shortName(rv)}. Years of trash talk end in the ring.`,bl.length?{title:{belts:bl},grudge:true}:{grudge:true}));
  }
  if(last&&(last.res==='L'||last.robbery)&&G.world.f[last.oppId]?.active&&G.world.f[last.oppId].div===d&&!last.rematched){
    const f=G.world.f[last.oppId];offers.push(mkOffer(f,'rematch','Rematch',last.robbery?'Everyone saw the robbery. The commission ordered an immediate rematch.':'Your rematch clause kicks in. Get it back.',{rematchOf:last.id}));
  }
  G.offers=offers.filter(Boolean).slice(0,5);
  return G.offers;
}

/* ---------- fight booking & camp ---------- */
function acceptOffer(o){
  G.next={offer:o,weeksLeft:o.weeks,sessions:[],fatigue:0,scout:0,cutWork:0,gameplan:0};
  G.offers=[];
  if(o.chapter)G.flags['ch_'+o.chapter+'_off']=true;
  const f=G.world.f[o.oppId];
  news(`Signed: ${fullName(B())} vs ${fullName(f)}, ${o.rounds} rounds${o.venue?' at the '+o.venue:''}.`);
  if(f.legend&&LEGEND_BY[f.legend].ai?.trash)news(`${shortName(f)} at the press conference: "I'm so fast I turned off the light and was in bed before the room got dark!"`,'gold');
}
function campBoosts(){const t=TRAINERS[G.trainer],g=GYMS[G.gym];const age=ageOf(B().born);return t.train*g.train*(age>=34?.72:age>=30?.86:age<=22?1.1:1)}
const CAMP={
  bag:{name:'Heavy Bag',stat:'pow',alt:'sta',desc:'Rhythm combos on the heavy bag. Builds Power.'},
  speed:{name:'Speed Bag',stat:'spd',alt:'iq',desc:'Keep the rhythm as it speeds up. Builds Speed.'},
  rope:{name:'Jump Rope',stat:'sta',alt:'foot',desc:'Time each jump. Builds Stamina and Footwork.'},
  mitts:{name:'Mitt Work',stat:'def',alt:'iq',desc:'React to your trainer\'s calls. Builds Defense and Ring IQ.'},
  spar:{name:'Sparring',stat:'iq',alt:'chin',desc:'One live round against a partner who fights like your opponent. Big XP, small injury risk.'},
  film:{name:'Film Study',desc:'Study their fights. Their tells last longer on fight night (stacks twice).'},
  cut:{name:'Weight Management',desc:'Dial in the diet. Reduces weight-cut penalties.'},
  rest:{name:'Rest Day',desc:'Recover. Fatigue down, heal injuries one week faster.'},
};
function campResult(kind,q,auto){
  const b=B(),n=G.next,C=CAMP[kind],out={kind,q,lines:[]};
  const boost=campBoosts();
  if(['bag','speed','rope','mitts','spar'].includes(kind)){
    let xp=(kind==='spar'?110:55)+q*(kind==='spar'?150:95);xp*=boost*(auto?.7:1);
    out.xp=Math.round(xp);
    const tf=TRAINERS[G.trainer].focus;
    let g=q>=.85?2:q>=.6?1:(chance(q)?1:0);if(auto)g=chance(.45)?1:0;
    if(boost>=1.25&&chance(.35))g++;
    if(tf&&C.stat===tf)g++;
    if(g){const got=gainStat(C.stat,g);if(got)out.lines.push(`+${got} ${STAT_NAME[C.stat]}`)}
    if(chance(q*.45)){const got=gainStat(C.alt,1);if(got)out.lines.push(`+${got} ${STAT_NAME[C.alt]}`)}
    n.fatigue+=kind==='spar'?22:13;
    const ups=addXP(out.xp);out.ups=ups;
    if(kind==='spar'){n.scout=Math.min(2,n.scout+.5)}
  }else if(kind==='film'){n.scout=Math.min(2,n.scout+1);out.lines.push('Their tells will last longer on fight night.');n.fatigue=Math.max(0,n.fatigue-6);addXP(25)}
  else if(kind==='cut'){n.cutWork=Math.min(2,n.cutWork+1);out.lines.push('Weight-cut penalty reduced.');n.fatigue+=4}
  else if(kind==='rest'){n.fatigue=Math.max(0,n.fatigue-35);b.injuries.forEach(i=>i.wk=Math.max(0,i.wk-1));out.lines.push('Fatigue down.')}
  if(n.fatigue>60&&kind!=='rest'&&chance((n.fatigue-55)/180)){
    const id=pick(['knee','ribs','hand','shoulder']);addInjury(id,true);out.lines.push(`Overtraining injury: ${INJ[id].name}!`);out.injury=id;
  }
  n.sessions.push({kind,q:Math.round(q*100)});
  n.weeksLeft--;
  advanceWeeks(1,true);
  return out;
}
function addInjury(id,minor){
  const I=INJ[id];let wk=randi(I.wk[0],I.wk[1]);if(minor)wk=Math.ceil(wk*.6);
  const ex=B().injuries.find(i=>i.id===id);if(ex)ex.wk=Math.max(ex.wk,wk);else B().injuries.push({id,wk});
  news(`Injury: ${I.name} (${wk} weeks).`,'red');
}

/* ---------- time ---------- */
function advanceWeeks(n,inCamp){
  const b=B();
  for(let i=0;i<n;i++){
    const oldAge=ageOf(b.born);
    G.week++;
    b.injuries.forEach(x=>x.wk--);b.injuries=b.injuries.filter(x=>x.wk>0);
    worldWeek();
    if(ageOf(b.born)>oldAge)birthday();
  }
}
function birthday(){
  const b=B(),a=ageOf(b.born),dur=skillMods().durable||0,lines=[];
  if(a<=24){const k=pick(STAT_KEYS);gainStat(k,1);lines.push(`+1 ${STAT_NAME[k]}`)}
  if(a>=31){
    const dec=a>=36?3:a>=33?2:1;
    for(const k of ['spd','foot','sta']){const v=Math.round(dec*(1-dur*.6)*rand(.5,1.2));if(v>0){b.stats[k]=Math.max(20,b.stats[k]-v);lines.push(`-${v} ${STAT_NAME[k]}`)}}
    gainStat('iq',1);lines.push('+1 Ring IQ');
  }
  if([25,29,33].includes(a)&&b.natural<7&&chance(.4)){b.natural++;news(`You've filled out. Your natural weight is now ${DIVS[b.natural].name}.`,'gold')}
  news(`Happy ${ordinal(a)} birthday.${lines.length?' Age changes: '+lines.join(', ')+'.':''}`);
}
function worldWeek(){
  const W=G.world,rv=rivalF();
  const prev=RNG.use(careerRng().world);try{worldWeekInner(W,rv)}finally{RNG.use(prev)}
}
function worldWeekInner(W,rv){
  for(let d=0;d<8;d++){
    if(chance(.45)){
      const list=divFighters(d).filter(f=>f.pro!==false&&!f.amateur);
      if(list.length>3){
        const a=pick(list);const near=list.filter(f=>f!==a&&Math.abs(f.pts-a.pts)<140);const c=near.length?pick(near):pick(list.filter(f=>f!==a));
        simWorldFight(a,c,d,false);
      }
    }
    if(chance(.035)){
      const ch=G.world.champs[d],k=pick(BODIES).k,cid=ch[k];
      if(cid&&cid!=='P'){const c=W.f[cid];const top=ranking(d).filter(e=>e.id!=='P'&&e.id!==cid&&!beltsOf(e.id,d).length).slice(0,5);if(c&&top.length)simWorldFight(c,pick(top).f,d,true)}
    }
  }
  if(G.week%52===0)yearTick();
  if(rv&&rv.active){rv.rating+=((playerOvr()+rv.edge)-rv.rating)*.03;rv.rating=clamp(rv.rating,30,97)}
}
function simWorldFight(a,c,d,title){
  const pa=1/(1+Math.pow(10,(c.rating-a.rating)/12));
  const draw=chance(.04);const aw=!draw&&chance(pa);const w=aw?a:c,l=aw?c:a;
  if(draw){a.d++;c.d++;return}
  w.w++;l.l++;const ko=chance(w.arch==='slugger'?.6:.4);if(ko)w.ko++;
  const g=clamp(18+(l.pts-w.pts)*.12+(ko?6:0),4,60);w.pts=Math.min(1000,w.pts+g);l.pts=Math.max(0,l.pts-clamp(22+(l.pts-w.pts)*.05,8,50));
  if(title){
    const lb=beltsOf(l.id,d);if(lb.length){lb.forEach(k=>G.world.champs[d][k]=w.id);
      if(w.legend||l.legend||w.rival||l.rival||chance(.5))news(`${DIVS[d].name}: ${shortName(w)} beats ${shortName(l)}${ko?' by KO':''} to take the ${lb.join(' & ')} title.`,w.rival?'red':'')}
  }else if(w.rival&&chance(.6))news(`Your rival ${shortName(w)} beats ${shortName(l)}${ko?' by knockout':''}. Now ${recStr(w)}.`,'red');
  else if((w.legend||l.legend)&&chance(.25))news(`${shortName(w)} defeats ${shortName(l)}${ko?' by KO':''} (${DIVS[d].short}).`);
}
function yearTick(){
  const W=G.world;
  for(const id in W.f){
    const f=W.f[id];if(!f.active||f.amateur)continue;const a=ageOf(f.born);
    if(a<26)f.rating=Math.min(f.pot,f.rating+randi(0,3));else if(a>31)f.rating-=randi(1,3)*(f.legend?.6:1);
    const retireAge=f.legend?39:36;
    if(!f.rival&&(a>=retireAge&&chance(.5)||f.rating<32||(a>33&&f.l>f.w&&chance(.4)))){
      f.active=false;const bl=beltsOf(f.id,f.div);bl.forEach(k=>G.world.champs[f.div][k]=null);
      if(f.legend||bl.length)news(`${fullName(f)} retires at ${a} with a record of ${recStr(f)}.`);
      if(bl.length)assignChamps(f.div,false);
      const nf=makeFighter(f.div,rand(45,64),randi(19,22));nf.pts=randi(120,300);nf.w=randi(3,10);nf.l=randi(0,2);nf.ko=Math.floor(nf.w*.6);W.f[nf.id]=nf;W.divs[f.div].push(nf.id);
    }
    if(f.legend&&LEGEND_BY[f.legend].movesUp&&f.div<5&&chance(.45)){
      const bl=beltsOf(f.id,f.div);bl.forEach(k=>G.world.champs[f.div][k]=null);if(bl.length)assignChamps(f.div,false);
      W.divs[f.div]=W.divs[f.div].filter(x=>x!==f.id);f.div++;W.divs[f.div].push(f.id);f.pts=Math.max(f.pts-120,500);
      news(`${fullName(f)} moves up to ${DIVS[f.div].name}, chasing titles in another division.`,'gold');
    }
  }
  for(let d=0;d<8;d++){W.divs[d]=W.divs[d].filter(id=>W.f[id]&&(W.f[id].active||id===G.rival?.id));assignChamps(d,false)}
  const keep=new Set([G.rival?.id,G.flags.tookFrom,G.next?.offer.oppId,...G.am.opps,...W.divs.flat()]);
  for(const id in W.f){const f=W.f[id];if(!keep.has(id)&&!f.legend)delete W.f[id]}
}

/* ---------- fight setup & results ---------- */
function oppCombat(f,o={}){
  const L=f.legend?LEGEND_BY[f.legend]:null;
  const st=statsFromRating(f.rating+(o.spar?-6:0),f.arch);
  if(L?.ai?.chinBonus)st.chin=Math.min(99,st.chin+L.ai.chinBonus);
  const ai=deep(ARCH[f.arch].ai);if(L?.ai)Object.assign(ai,deep(L.ai));
  return {name:shortName(f),first:f.first,last:f.last,stats:st,look:f.look,stance:f.stance,reach:f.reach,ai,abilities:L?[L.ab]:(f.rating>=80?[ARCH[f.arch].ability]:[]),mods:{},legend:f.legend,rival:!!f.rival};
}
function playerCombat(){
  const b=B();
  return {name:b.first+' '+b.last,first:b.first,last:b.last,stats:effectiveStats(),look:b.look,stance:b.stance,reach:b.reach,abilities:b.equipped.slice(),mods:skillMods(),weight:weightInfo()};
}
function ptsDelta(my,opp,win,ko,title){
  if(win){let g=20+clamp((opp-my)*.13,-14,70)+(ko?8:0)+(title?70:0);if(opp<my-160)g*=.5;return Math.round(clamp(g,4,150))}
  return -Math.round(clamp(26+clamp((my-opp)*.08,-14,30)+(ko?10:0),8,70));
}
function applyResult(o,res){
  const b=B(),f=G.world.f[o.oppId],win=res.winner==='p',loss=res.winner==='o',ko=['KO','TKO','RTD','DQ'].includes(res.method);
  const out={lines:[],levelUps:0,money:0,news:[]};
  const pro=!o.amateur;
  const prevRank=playerRank();
  if(pro){if(win){b.record.w++;if(ko)b.record.ko++}else if(loss)b.record.l++;else b.record.d++}
  else{if(win)b.am.w++;else b.am.l++}
  if(win){f.l++}else if(loss){f.w++;if(ko)f.ko++}else f.d++;
  b.form.push(win?(ko?'WKO':'W'):loss?(ko?'LKO':'L'):'D');if(b.form.length>8)b.form.shift();
  b.streak=win?Math.max(1,b.streak+1):loss?Math.min(-1,b.streak-1):0;
  // xp (capped so one upset can't grant a burst of levels)
  const diffR=f.rating-playerOvr();
  let xp=140+o.rounds*18+(win?160:loss?45:90)+(ko&&win?70:0)+clamp(diffR*7,-60,180)+(o.title?180:0)+(f.legend?120:0)+(res.stats.p.landed*.6);
  xp*=DIFF[G.diff].xp*(pro?1:.75)*(o.sim?.6:1);
  xp=Math.min(xp,xpNeed(b.level)*1.6);
  out.xp=Math.round(xp);out.levelUps=addXP(xp);
  // pts and belts
  if(pro){
    const dp=win||loss?ptsDelta(b.pts,f.pts,win,ko,o.title&&!o.title.regional&&win):0;
    b.pts=clamp(b.pts+dp,0,1000);out.pts=dp;
    if(win)f.pts=Math.max(0,f.pts-25);else if(loss)f.pts=Math.min(1000,f.pts+20);
    if(o.title&&!o.title.regional){
      const d=b.div;
      if(win){
        const prev=beltsOf('P',d).length;
        o.title.belts.forEach(k=>G.world.champs[d][k]='P');
        if(o.title.defense){b.defenses++;out.lines.push('Title defended!')}
        else{b.titleWins++;b.formerChamp=true;if(!b.titleDivs.includes(d))b.titleDivs.push(d);G.flags.tookFrom=f.id;G.flags.tookWeek=G.week;
          out.lines.push(`NEW ${o.title.belts.join(' & ')} ${DIVS[d].name.toUpperCase()} CHAMPION`)}
        if(beltsOf('P',d).length===4&&prev<4){b.undisputed++;out.lines.push('UNDISPUTED CHAMPION OF THE WORLD');news(`${fullName(b)} is the undisputed ${DIVS[d].name} champion of the world.`,'gold')}
        G.flags.lastDefWeek=G.week;
      }else if(loss){
        const lost=beltsOf('P',d);lost.forEach(k=>G.world.champs[d][k]=f.id);
        if(lost.length)out.lines.push(`Lost the ${lost.join(' & ')} title.`);
      }
    }
    if(o.title?.regional&&win){b.regional=b.div;out.lines.push(`Continental ${DIVS[b.div].name} Champion`)}
  }
  // money
  if(pro){
    const pr=G.promoter?PROMOTERS[G.promoter.id]:null,t=TRAINERS[G.trainer],g=GYMS[G.gym];
    let gross=o.purse*(win?1:.85);if(o.missedWeight)gross*=.8;
    const lines=[['Purse',gross]];
    if(pr)lines.push([`${pr.co} (${Math.round(pr.cut*100)}%)`,-gross*pr.cut]);
    lines.push([`${t.name} (${Math.round(t.fee*100)}%)`,-gross*t.fee]);
    if(g.cost)lines.push([g.name,-g.cost]);
    if(G.staff.cutman)lines.push(['Cutman',-1500]);
    if(G.staff.nutri)lines.push(['Nutritionist',-2500]);
    const med=Math.round(res.dmgTaken*15+(res.kdAgainst*500));if(med>200)lines.push(['Medical',-med]);
    const net=sum(lines.map(l=>l[1]));
    b.money+=net;out.money=net;out.moneyLines=lines;
    if(G.promoter){G.promoter.left--;if(loss)G.promoter.losses=(G.promoter.losses||0)+1;else if(win)G.promoter.losses=0}
  }
  // hype
  let hy=win?(ko?6:3):loss?-6:0;if(o.title&&win)hy+=15;if(f.legend&&win)hy+=10;if(res.kdFor&&res.kdAgainst)hy+=4;
  b.hype=clamp(b.hype+hy,0,100);
  // damage & injuries
  const dur=skillMods().durable||0;
  const dmg=(res.dmgTaken*.008+res.kdAgainst*.8+(loss&&ko?3:0))*(1-dur)*(pro?1:.5)*(b.injuries.some(i=>i.id==='concussion')?1.6:1);
  b.damage=clamp(b.damage+dmg,0,100);out.damage=dmg;
  const injP=.05+res.dmgTaken/1600+res.kdAgainst*.05+(b.injuries.length?.05:0);
  const inj=[];
  if(res.cut>45&&chance(.7))inj.push('cut');
  if(chance(injP)){inj.push(wpick({hand:3,ribs:2,concussion:res.kdAgainst?3:.5,shoulder:1,knee:1,retina:b.damage>50?.6:.1}))}
  inj.forEach(i=>addInjury(i));out.injuries=inj;
  if(b.injuries.some(i=>i.id==='retina')&&o.foughtHurt&&chance(.3)){G.flags.forceRetire='Your retina detached again in the fight. The commission will not license you.'}
  // rival / legends
  if(f.rival){G.rival.met++;G.rival.lastMet=G.week;if(win)G.rival.w++;else if(loss)G.rival.l++}
  if(win&&f.legend&&!b.legendsBeaten.includes(f.legend)){b.legendsBeaten.push(f.legend);out.lines.push(`Beat a legend: ${fullName(f)}`);out.legendUnlock=f.legend;news(`You beat ${fullName(f)}. Their signature move, ${AB[LEGEND_BY[f.legend].ab].name}, is now learnable in Skills.`,'gold')}
  // rematch tracking
  if(o.rematchOf){const h=G.history.find(x=>x.id===o.rematchOf);if(h)h.rematched=true}
  // history
  const h={id:'h'+uid(),w:G.week,oppId:f.id,opp:fullName(f),oppRec:recStr(f),oppRating:Math.round(f.rating),res:win?'W':loss?'L':'D',method:res.method,round:res.round,time:res.time,level:b.level,ovr:playerOvr(),ptsAfter:b.pts,age:ageOf(b.born),sim:!!o.sim,
    title:o.title?(o.title.regional?'Continental':o.title.belts.join('/')):'',type:o.type,label:o.label,purse:o.purse,pro,robbery:res.robbery,cards:res.cards,div:b.div,chapter:o.chapter||null};
  G.history.push(h);out.hist=h;
  // chapters
  if(o.chapter){const ch=CHAPTERS.find(c=>c.id===o.chapter);if(ch&&ch.done){const t=ch.done(win,res,o);if(t)out.lines.push(t)}}
  // news
  const how=res.method==='KO'||res.method==='TKO'?`by ${res.method} in round ${res.round}`:res.method==='RTD'?`when the corner stopped it after round ${res.round}`:`by ${res.method==='UD'?'unanimous':res.method==='SD'?'split':res.method==='MD'?'majority':''} decision`;
  if(win)news(`${fullName(b)} def. ${fullName(f)} ${how}.${o.title&&!o.title.defense&&!o.title.regional?' A new champion!':''}`,o.title?'gold':'');
  else if(loss)news(`${fullName(f)} def. ${fullName(b)} ${how}.${res.robbery?' Ringside is calling it a robbery.':''}`,'red');
  else news(`${fullName(b)} and ${fullName(f)} fight to a draw.`);
  // amateur progression
  if(!pro){
    G.am.results.push(win?'W':'L');
    if(win&&G.am.round<2){G.am.round++}
    else{
      const T=AM_TOURNEYS[G.am.stage];
      if(win){G.flags['am_gold_'+G.am.stage]=true;out.lines.push(`${T.name} CHAMPION`);news(`Gold at the ${T.name}!`,'gold');b.hype+=6}
      else out.lines.push(`Eliminated in the ${T.rounds[G.am.round]}`);
      G.am.done=true;
    }
  }
  // recovery time
  const rec=Math.round(2+res.dmgTaken/55+res.kdAgainst+(pro?1:0)+(o.amateur&&!G.am.done?-2:0));
  out.recovery=Math.max(o.amateur&&!G.am.done?0:1,rec);
  if(out.recovery)advanceWeeks(out.recovery);
  // promoter drop
  if(G.promoter){const P=PROMOTERS[G.promoter.id];
    if((G.promoter.losses||0)>=P.drop){news(`${P.name} releases you from your contract after ${G.promoter.losses} straight losses.`,'red');out.lines.push(`Dropped by ${P.co}`);G.promoter=null}
    else if(G.promoter.left<=0){news(`Your contract with ${P.co} has ended. You're a free agent.`);out.lines.push('Contract finished: free agent');G.promoter=null}
  }
  if(pro)checkStripped();
  if(prevRank&&pro){const nr=playerRank();out.rank=[prevRank,nr]}
  G.next=null;
  return out;
}
function checkStripped(){
  const b=B();for(let d=0;d<8;d++){const bl=beltsOf('P',d);if(bl.length&&(d!==b.div)){bl.forEach(k=>G.world.champs[d][k]=null);assignChamps(d,false);news(`You vacate your ${bl.join(' & ')} ${DIVS[d].name} title${bl.length>1?'s':''}.`)}}
  const bl=beltsOf('P',b.div);
  if(bl.length&&G.flags.lastDefWeek!=null&&G.week-G.flags.lastDefWeek>45){const k=pick(bl);G.world.champs[b.div][k]=null;assignChamps(b.div,false);news(`The ${k} strips you of its title for failing to defend it in time.`,'red')}
}

/* ---------- quick sim ---------- */
function simFight(o){
  const pc=playerCombat(),f=G.world.f[o.oppId],oc=oppCombat(f);
  const ps=ovr(pc.stats),os=ovr(oc.stats)*({contender:.95,champion:1,legend:1.04}[G.diff]);
  const pw=1/(1+Math.pow(10,(os-ps)/11));
  const r=R(),draw=r<.04,win=!draw&&R()<pw;
  const ko=chance(.35+Math.abs(ps-os)/80);
  const round=ko?randi(1,o.rounds):o.rounds;
  const res={winner:draw?'draw':win?'p':'o',method:draw?'DRAW':ko?pick(['KO','TKO']):pick(['UD','UD','SD','MD']),round,time:ko?fmtTime(rand(10,170)):'3:00',
    cards:[],stats:{p:{thrown:randi(300,600),landed:0},o:{thrown:randi(300,600),landed:0}},dmgTaken:rand(60,220)*(win?.7:1.3),kdFor:win&&ko?randi(1,2):0,kdAgainst:!win&&ko?randi(1,2):0,cut:0};
  res.stats.p.landed=Math.round(res.stats.p.thrown*rand(.25,.45));res.stats.o.landed=Math.round(res.stats.o.thrown*rand(.25,.45));
  return res;
}

function promoterOffers(){

  for(const k in PROMOTERS){const P=PROMOTERS[k];if(b.pts>=P.minPts||(k==='golden'&&G.flags.am_gold_1)){
    let bonus=P.bonus*(1+b.hype/60)*(G.flags.am_gold_1?1.6:G.flags.am_gold_0?1.2:1);

}

/* ---------- legacy ---------- */
function legacy(){
  const b=B(),r=b.record;
  const parts=[
    ['Pro wins',r.w*2],['Knockouts',r.ko],['Losses',-r.l*3],
    ['World titles won',b.titleWins*25],['Title defenses',b.defenses*10],['Undisputed reigns',b.undisputed*60],
    ['Multi-division champion',Math.max(0,b.titleDivs.length-1)*40],['Legends beaten',b.legendsBeaten.length*15],
    ['Story chapters',G.chapters.length*20],['Rivalry wins',(G.rival?.w||0)*8],['Regional title',b.regional!=null||G.history.some(h=>h.title==='Continental'&&h.res==='W')?5:0],
    ['Amateur gold',(G.flags.am_gold_0?5:0)+(G.flags.am_gold_1?10:0)],
  ];
  if(G.flags.exile)parts.push(['Took a stand',40]);
  if(b.retired&&r.l===0&&r.w>=25)parts.push(['Retired undefeated',50]);
  const score=Math.max(0,Math.round(sum(parts.map(p=>p[1]))));
  const tiers=[[0,'Journeyman'],[60,'Contender'],[150,'Champion'],[300,'Hall of Famer'],[500,'All-Time Great'],[800,'The Greatest of All Time']];
  let tier=tiers[0][1],next=null;for(let i=0;i<tiers.length;i++){if(score>=tiers[i][0]){tier=tiers[i][1];next=tiers[i+1]||null}}
  return {score,tier,parts,next};
}

  const b=B(),f=pickOpp(b.pts,new Set(),b.div);if(!f)return;
  b.record.l++;f.w++;b.form.push('L');b.streak=Math.min(-1,b.streak-1);b.pts=Math.max(0,b.pts-30);
  G.history.push({id:'h'+uid(),w:G.week,oppId:f.id,opp:fullName(f),oppRec:recStr(f),oppRating:f.rating,res:'L',method:'SD',round:10,time:'3:00',title:'',type:'dive',label,purse:0,pro:true,div:b.div});
}

function maybeEvent(force,id){
  if(id){const e=EVENTS.find(x=>x.id===id);if(!e)return null;if(e.prep&&!e.prep())return null;return e}
  if(G.phase!=='pro')return null;
  if(!force&&(G.week-(G.flags.lastEvent||-99)<5||!chance(.5)))return null;
  const pool=EVENTS.filter(e=>{try{return e.cond()}catch(x){return false}});
  if(!pool.length)return null;
  const w={};pool.forEach(e=>w[e.id]=e.w);
  const pickId=wpick(w);const e=EVENTS.find(x=>x.id===pickId);
  if(e.prep&&!e.prep())return null;
  G.flags.lastEvent=G.week;
  return e;
}
/* ================= drawing: modern stylized fighters, arena, portraits =================
   Style: exaggerated proportions, soft two-tone shading, rim light from the top-left key light,
   dark outline only on the silhouette of each part. Everything is drawn in code. */
function shade(hex,amt){
  let c=parseInt(hex.slice(1),16),r=c>>16,g=(c>>8)&255,b=c&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return `rgb(${r|0},${g|0},${b|0})`;
}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const OUTLINE='#1a1220';
/* draw a closed path with outline, base fill, shadow side, highlight and rim light.
   pathFn(ctx) must leave a closed path. cx,cy,r give the shading center and radius. */
function part(ctx,pathFn,base,cx,cy,r,o={}){
  const lw=o.lw??5;
  pathFn(ctx);ctx.lineJoin='round';ctx.lineWidth=lw;ctx.strokeStyle=o.outline||OUTLINE;ctx.stroke();
  pathFn(ctx);ctx.fillStyle=base;ctx.fill();
  ctx.save();pathFn(ctx);ctx.clip();
  // shadow side (bottom-right), light side (top-left)
  const g=ctx.createRadialGradient(cx-r*.45,cy-r*.5,r*.1,cx,cy,r*1.25);
  g.addColorStop(0,'rgba(255,255,255,'+(o.hi??.22)+')');g.addColorStop(.55,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(10,6,20,'+(o.sh??.38)+')');
  ctx.fillStyle=g;ctx.fillRect(cx-r*2,cy-r*2,r*4,r*4);
  if(o.rim!==false){ctx.translate(2.5,2.5);pathFn(ctx);ctx.lineWidth=4;ctx.strokeStyle='rgba(255,236,200,'+(o.rimA??.33)+')';ctx.stroke()}
  ctx.restore();
}
function capsule(ctx,x1,y1,x2,y2,w1,w2){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  ctx.beginPath();ctx.arc(x1,y1,w1/2,Math.atan2(ny,nx),Math.atan2(ny,nx)+Math.PI);ctx.lineTo(x2-nx*w2/2,y2-ny*w2/2);ctx.arc(x2,y2,w2/2,Math.atan2(-ny,-nx),Math.atan2(-ny,-nx)+Math.PI);ctx.closePath();
}
function drawGlove(ctx,x,y,r,col,glow,glowCol,opt={}){
  if(glow>0){ctx.save();ctx.globalAlpha=Math.min(1,glow);const gr=ctx.createRadialGradient(x,y,r*.5,x,y,r*2.4);gr.addColorStop(0,glowCol||'#ffd34d');gr.addColorStop(.5,'rgba(255,220,110,.5)');gr.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r*2.4,0,7);ctx.fill();ctx.restore()}
  // cuff / wrist
  if(!opt.noCuff){part(ctx,c=>{c.beginPath();c.ellipse(x+(opt.cuffDx||0),y+r*.95,r*.62,r*.36,0,0,7);c.closePath()},'#f3efe6',x,y+r*.9,r*.6,{hi:.3,sh:.3,rimA:.2})}
  // mitt
  part(ctx,c=>{c.beginPath();c.ellipse(x,y,r,r*1.04,0,0,7);c.closePath()},col,x,y,r,{hi:.32,sh:.4,lw:opt.lw||5});
  // thumb / seam
  ctx.save();ctx.beginPath();ctx.ellipse(x,y,r,r*1.04,0,0,7);ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(x+r*.08,y+r*.42,r*.6,r*.3,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.ellipse(x-r*.34,y-r*.44,r*.3,r*.17,-.55,0,7);ctx.fill();
  ctx.restore();
}
/* ---------- head ---------- */
function drawHead(ctx,L,x,y,face,cut,o={}){
  const skin=SKIN[L.skin],hc=HAIRC[L.hc||0],dk=shade(skin,-.3);
  const R=34,tilt=o.tilt||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
  const d=o.dmg||{};
  if(L.hair==='afro'){part(ctx,c=>{c.beginPath();c.arc(0,-14,46,0,7);c.closePath()},hc,0,-14,46,{hi:.15,sh:.4})}
  // ears
  part(ctx,c=>{c.beginPath();c.ellipse(-33,4,8,11,0,0,7);c.closePath()},dk,-33,4,9,{rim:false,hi:.1});
  part(ctx,c=>{c.beginPath();c.ellipse(33,4,8,11,0,0,7);c.closePath()},dk,33,4,9,{rim:false,hi:.1});
  // face
  const jaw=o.jaw||1;
  part(ctx,c=>{c.beginPath();c.moveTo(-R,-8);c.quadraticCurveTo(-R-2,-36,0,-R-4);c.quadraticCurveTo(R+2,-36,R,-8);c.quadraticCurveTo(R-1,22*jaw,0,34*jaw);c.quadraticCurveTo(-R+1,22*jaw,-R,-8);c.closePath()},skin,-6,-10,R*1.1,{hi:.2,sh:.36});
  // swelling & redness
  const sw=(sx,amt)=>{if(amt<=0)return;ctx.save();ctx.globalAlpha=Math.min(.75,amt*.9);const g=ctx.createRadialGradient(sx,-2,2,sx,-2,14+amt*8);g.addColorStop(0,'#b2403f');g.addColorStop(.6,'#9a3f55');g.addColorStop(1,'rgba(150,60,80,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(sx,-1,15+amt*7,12+amt*5,0,0,7);ctx.fill();ctx.restore()};
  sw(-12,d.swellL||0);sw(12,d.swellR||0);
  if(d.cheek>0){ctx.save();ctx.globalAlpha=Math.min(.5,d.cheek*.6);ctx.fillStyle='#b2403f';ctx.beginPath();ctx.ellipse(0,18,20,9,0,0,7);ctx.fill();ctx.restore()}
  // hair
  const cap=(h,fr,alpha=1)=>{ctx.save();ctx.globalAlpha=alpha;part(ctx,c=>{c.beginPath();c.moveTo(-R-1,-8);c.quadraticCurveTo(-R-4,-h*.6,-R*.55,-h);c.quadraticCurveTo(0,-h-8+fr,R*.55,-h);c.quadraticCurveTo(R+4,-h*.6,R+1,-8);c.quadraticCurveTo(0,-30,-R-1,-8);c.closePath()},hc,0,-30,R,{hi:.12,sh:.45});ctx.restore()};
  if(L.hair==='buzz')cap(40,0,.8);
  else if(L.hair==='short'||L.hair==='braids'||L.hair==='topknot'){cap(46,5);
    if(L.hair==='braids'){ctx.strokeStyle=shade(hc,.3);ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*9,-40);ctx.lineTo(i*10,-18);ctx.stroke()}}
    if(L.hair==='topknot')part(ctx,c=>{c.beginPath();c.arc(0,-48,10,0,7);c.closePath()},hc,0,-48,10,{})}
  else if(L.hair==='slick'){cap(44,8);ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(-9,-33,11,3.5,-.3,0,7);ctx.fill()}
  else if(L.hair==='mohawk'){cap(42,0,.4);part(ctx,c=>{rrect(c,-7,-62,14,32,6)},hc,0,-46,14,{})}
  else if(L.hair==='afro'){part(ctx,c=>{c.beginPath();c.ellipse(0,-18,32,22,0,Math.PI,0);c.closePath()},hc,0,-20,30,{hi:.1,sh:.3})}
  else if(L.hair==='bald'){ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(-8,-26,10,5.5,-.3,0,7);ctx.fill()}
  // brows
  const bc=L.hair==='bald'?shade(skin,-.55):hc;
  const angry=face==='angry'||o.wind,up=face==='hurt'||face==='ko';
  ctx.strokeStyle=bc;ctx.lineWidth=4;ctx.lineCap='round';
  const bo=angry?3:up?-4:0;
  ctx.beginPath();ctx.moveTo(-19,-11-bo*.5);ctx.lineTo(-6,-9+bo);ctx.moveTo(19,-11-bo*.5);ctx.lineTo(6,-9+bo);ctx.stroke();
  // eyes
  ctx.lineWidth=2.6;
  const eyeY=0;
  if(face==='ko'||face==='hurt'){
    ctx.strokeStyle='#1a1010';
    for(const s of [-1,1]){const ex=s*12,ey=eyeY;
      if(face==='ko'){ctx.beginPath();ctx.moveTo(ex-5,ey-5);ctx.lineTo(ex+5,ey+5);ctx.moveTo(ex+5,ey-5);ctx.lineTo(ex-5,ey+5);ctx.stroke()}
      else{ctx.beginPath();ctx.arc(ex,ey,5,0.2,Math.PI*1.7);ctx.stroke()}}
  }else if(face==='hit'||o.blink){ctx.strokeStyle='#1a1010';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,eyeY);ctx.quadraticCurveTo(-12,eyeY+4,-6,eyeY+1);ctx.moveTo(18,eyeY);ctx.quadraticCurveTo(12,eyeY+4,6,eyeY+1);ctx.stroke()}
  else{
    for(const s of [-1,1]){const sq=(s<0?d.swellL:d.swellR)||0;const h=4.2*(1-Math.min(.85,sq*.7));
      ctx.fillStyle='#f6f3ec';ctx.beginPath();ctx.ellipse(s*12,eyeY,6,h,0,0,7);ctx.fill();
      ctx.fillStyle=o.flash?'#ffcf3a':'#1a1210';ctx.beginPath();ctx.arc(s*12+(o.look||0),eyeY+.4,Math.min(h,2.8),0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(s*12-1,eyeY-1,.9,0,7);ctx.fill()}
    if(o.flash){ctx.fillStyle='rgba(255,220,80,.55)';ctx.beginPath();ctx.arc(-12,eyeY,10,0,7);ctx.arc(12,eyeY,10,0,7);ctx.fill()}

      const nx=S.cues.filter(c=>!c.res).slice(1,4);ctx.font='13px "Barlow Condensed",sans-serif';ctx.fillStyle='#9ca3c0';ctx.textAlign='left';ctx.fillText(nx.length?'NEXT: '+nx.map(c=>MG.bag.labels[c.type].toUpperCase()).join(' · '):'',12,390);
    }
    if(kind==='speed'){
      ctx.fillStyle='#3a2a1a';ctx.fillRect(80,40,240,26);ctx.fillStyle='#2a2a2a';ctx.fillRect(196,66,8,20);
      const b=S.bounce;ctx.fillStyle='#b8321f';ctx.beginPath();ctx.ellipse(200,130+b*-14,34,46-b*8,0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(190,112,10,16,0,0,7);ctx.fill();
      const cue=S.cues.find(c=>!c.res);
      if(cue){const k=clamp((cue.t-t)/.6,0,1);for(const sd of ['L','R']){const x=sd==='L'?100:300,on=cue.type===sd;
        ctx.fillStyle=on?`rgba(240,190,72,${1-k*.7})`:'rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(x,260,46,0,7);ctx.fill();
        if(on){ctx.strokeStyle='#f0be48';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,260,46+60*k,0,7);ctx.stroke()}
        ctx.fillStyle=on?'#1a1206':'#9ca3c0';ctx.font='22px "Alfa Slab One",Georgia';ctx.textAlign='center';ctx.fillText(sd==='L'?'LEFT':'RIGHT',x,268)}}
    }
    if(kind==='rope'){
      const f=((S.phase%1)+1)%1,a=f*Math.PI*2;const jy=S.jumpT>0?-Math.sin(S.jumpT/.32*Math.PI)*42:0;
      const ry=Math.cos(a);const front=ry>0;
      const drawRope=()=>{ctx.strokeStyle='#e8d7a5';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(150,200+jy);ctx.quadraticCurveTo(200,200+ry*190+jy*.3,250,200+jy);ctx.stroke()};
      if(!front)drawRope();
      ctx.fillStyle='#c98e62';ctx.beginPath();ctx.arc(200,120+jy,22,0,7);ctx.fill();ctx.fillStyle='#d8392f';ctx.fillRect(176,145+jy,48,80);ctx.fillStyle='#2f6fe2';ctx.fillRect(178,225+jy,44,34);
      ctx.fillStyle='#a8704a';ctx.fillRect(182,259+jy,14,90);ctx.fillRect(204,259+jy,14,90);
      if(front)drawRope();
      ctx.fillStyle='#9ca3c0';ctx.font='15px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.fillText(`JUMPS ${S.jumps}/25 · TRIPS ${S.trips}/3`,200,390);
    }
    if(kind==='mitts'){
      ctx.fillStyle='#c98e62';ctx.beginPath();ctx.arc(200,90,30,0,7);ctx.fill();ctx.fillStyle='#232a4a';rrect(ctx,150,120,100,130,20);ctx.fill();
      ctx.fillStyle='#e9e1cf';ctx.beginPath();ctx.arc(130,170,28,0,7);ctx.arc(270,170,28,0,7);ctx.fill();ctx.fillStyle='#d8392f';ctx.beginPath();ctx.arc(130,170,12,0,7);ctx.arc(270,170,12,0,7);ctx.fill();
      if(S.cur&&!S.cur.res){const k=1-(t-S.cur.t0)/S.cur.win;ctx.fillStyle='#fff';ctx.font='30px "Alfa Slab One",Georgia';ctx.textAlign='center';
        ctx.fillText(MG.mitts.labels[S.cur.type].replace('◀ ','').replace(' ▶','').toUpperCase()+(S.cur.type==='slipL'?' LEFT':S.cur.type==='slipR'?' RIGHT':'')+'!',200,300);
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(80,320,240,10);ctx.fillStyle=k>.4?'#4fca8e':'#f05a55';ctx.fillRect(80,320,240*Math.max(0,k),10)}
      ctx.fillStyle='#9ca3c0';ctx.font='15px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.fillText(`CALL ${S.n}/${S.max}`,200,390);
    }
    if(S.msgT>0){ctx.globalAlpha=Math.min(1,S.msgT*3);ctx.font='26px "Alfa Slab One",Georgia';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(S.msg,200,40+(.6-S.msgT)*-20+30);ctx.fillStyle=S.msgCol;ctx.fillText(S.msg,200,40+(.6-S.msgT)*-20+30);ctx.globalAlpha=1}
  };
  ov.innerHTML=`<div class="card" style="max-width:380px;text-align:center;display:flex;flex-direction:column;gap:10px"><b class="ui" style="font-size:22px;text-transform:uppercase;letter-spacing:.06em">${M.title}</b><p>${M.how}</p><button class="btn primary" id="mgst">Start</button></div>`;
  $('#mgst',ov).onclick=()=>{ov.className='fov';ov.innerHTML='';running=true;t=0;last=performance.now()};
  last=performance.now();raf=requestAnimationFrame(loop);
  const cleanup=()=>window.removeEventListener('keydown',kd);
  const obs=new MutationObserver(()=>{if(!el.isConnected){cleanup();obs.disconnect()}});obs.observe(document.body,{childList:true});
}

function pathHTML(){

  const r=playerRank(),bl=beltsOf('P',b.div),list=ranking(b.div);

  else if(bl.length){goal=`Champion. Unify the remaining ${4-bl.length} belt${4-bl.length>1?'s':''} or defend.`}
  else if(r<=3){goal='Mandatory challenger: a title shot is on the table.'}

  else if(r<=15){goal='Ranked. Reach the top 6 to get title-shot offers.'}
  else{const e15=list[14];need=e15?Math.max(0,e15.pts-b.pts+1):0;goal=`Unranked. About ${need} ranking points to crack the top 15. Step-up fights earn the most.`}
  const pct=clamp(1-(r-1)/Math.max(1,list.length-1),0,1);

function doCamp(kind){
  const n=G.next;if(!n||n.weeksLeft<=0)return;
  if(G.flags.campPenalty){G.flags.campPenalty=0;n.weeksLeft--;advanceWeeks(1);toast('Sponsor appearances cost you a week.');if(n.weeksLeft<=0){Save.write();return UI.render()}}
  const fin=(q,auto)=>{const r=campResult(kind,q,auto);Save.write();showCampResult(r)};
  if(['bag','speed','rope','mitts'].includes(kind))runMinigame(kind,q=>fin(q));
  else if(kind==='spar'){
    const f=G.world.f[n.offer.oppId];
    const partner={...oppCombat(f,{spar:true}),name:'Sparring partner',first:'Sparring',last:'Partner',look:Object.assign(randomLook(),{gloves:'#2f6fe2'})};
    partner.stats=statsFromRating(Math.min(f.rating,playerOvr()+2)-4,f.arch);partner.abilities=[];
    const pc=playerCombat();pc.stats=Object.assign({},B().stats);
    new Fight({p:pc,o:partner,rounds:1,roundLen:Math.min(60,Settings.roundLen),diff:G.diff,sparring:true,corner:1,onEnd:res=>{
      const q=clamp(.5+(res.dmgDealt-res.dmgTaken)/90+(res.winner==='p'&&['KO','TKO'].includes(res.method)?.25:0),0,1);
      const r=campResult('spar',q);if(chance(.04+res.dmgTaken/1500)){addInjury(pick(['cut','hand','ribs']),true);r.lines.push('Sparring injury!')}Save.write();UI.render();showCampResult(r)}}).mount();
  }else fin(1);
}
function showCampResult(r){
  UI.render();
  const lv=r.ups?`<p class="goldt"><b>LEVEL UP!</b> You're now level ${B().level}. Spend your points in Boxer and Skills.</p>`:'';
  modal(`<div class="kicker">${CAMP[r.kind].name}${r.q!=null&&r.xp?` · ${Math.round(r.q*100)}%`:''}</div>${r.xp?`<p class="rec">+${r.xp} XP</p>`:''}${r.lines.length?`<p>${r.lines.map(esc).join('<br>')}</p>`:''}${lv}<p class="muted" style="font-size:13.5px">${G.next?`${G.next.weeksLeft} week${G.next.weeksLeft!==1?'s':''} until the fight.`:''}</p><button class="btn primary" data-close="ok">Continue</button>`,{onClose:()=>{if(r.ups)Sfx.great();UI.render();checkEvent()}});
  if(r.ups)Sfx.great();
}

SCR.fightnight=()=>{

  const ch=o.chapter?CHAPTERS.find(c=>c.id===o.chapter):null;
  const ps=ovr(pc.stats),os=ovr(oc.stats);const pw=1/(1+Math.pow(10,(os-ps)/11));
  const odds=o.mods?.odds||(pw>.78?'Heavy favorite':pw>.5?'Favorite':pw>.25?'Underdog':'Big underdog');
  const row=(l,a,c,adv)=>`<div class="c ${adv==='a'?'adv':''}">${a}</div><div class="m">${l}</div><div class="c ${adv==='c'?'adv':''}">${c}</div>`;
  const cmp=(a,c,hi=true)=>a===c?'':(a>c)===hi?'a':'c';
  const L=f.legend?LEGEND_BY[f.legend]:null;
  return `<div class="scr"><div class="wrap" style="max-width:760px">
    <div class="topbar"><button class="btn sm back" data-go="home">◀</button><div class="t">Fight night</div>${o.venue?`<span class="pill">${esc(o.venue)}</span>`:''}</div>
    ${ch?`<div class="hero"><div class="in"><div class="kicker">Story chapter</div><h1 class="disp" style="font-size:28px">${esc(ch.title)}</h1><p>${esc(ch.intro)}</p><p class="dim" style="font-size:12.5px">Inspired by ${esc(ch.homage)}</p></div></div>`:''}
    <div class="card col"><div class="kicker" style="text-align:center">${esc(o.label)} · ${o.rounds} rounds${o.title&&!o.title.regional?' · '+o.title.belts.join(' / ')+' '+DIVS[b.div].name+' title':''}</div>
      <div class="vsrow"><div><img src="${portrait(b.look)}" alt=""><div class="nm">${esc(b.first)} ${esc(b.last)}</div></div><div class="vs">VS</div><div><img src="${portrait(f.look)}" alt=""><div class="nm">${esc(f.first)} ${esc(f.last)}</div></div></div>
      <div class="tape">${row('Record',`${b.record.w}-${b.record.l}${b.record.d?'-'+b.record.d:''}`,recStr(f))}${row('Age',ageOf(b.born),ageOf(f.born),cmp(ageOf(f.born),ageOf(b.born)))}
      ${row('Height',ftIn(b.height),ftIn(f.height),cmp(b.height,f.height))}${row('Reach',b.reach+'″',f.reach+'″',cmp(b.reach,f.reach))}
      ${row('Stance',b.stance,f.stance)}${row('Style',ARCH[b.arch].name,ARCH[f.arch].name)}${row('Overall',ps,os,cmp(ps,os))}${row('Weight',DIVS[b.div].lb+' lb',DIVS[b.div].lb+' lb')}</div>
      <p style="text-align:center" class="muted">Odds: <b>${esc(odds)}</b>${L?` · <span class="goldt">Homage to ${esc(L.homage)}</span>`:''}</p>
      ${wi&&wi.diff!==0?`<p style="text-align:center" class="${wi.tone==='bad'?'bad':'warnt'}">${esc(wi.label)}: ${esc(wi.note)}</p>`:''}
      ${b.injuries.length?`<p style="text-align:center" class="bad">Fighting hurt: ${b.injuries.map(i=>INJ[i.id].name).join(', ')}</p>`:''}
    </div>
    <button class="btn primary wide" data-act="walk" style="min-height:60px;font-size:20px">Walk to the ring</button>
    ${o.amateur||o.title||o.chapter?'':`<button class="btn ghost" data-act="simfight">Simulate fight (60% XP)</button>`}
  </div></div>`;
};
function startFight(sim){
  const n=G.next,o=n.offer,f=G.world.f[o.oppId],wi=weightInfo();
  o.foughtHurt=B().injuries.length>0;
  if(wi&&wi.miss&&chance(wi.miss)&&!o.amateur){o.missedWeight=true;news('You missed weight at the weigh-in. 20% of your purse goes to your opponent.','red');toast('Missed weight! 20% purse fine')}
  if(sim){afterFight(o,simFight(o));return}
  const pc=playerCombat();if(o.missedWeight)pc.stats.sta=Math.round(pc.stats.sta*.9);
  if(o.foughtHurt&&B().injuries.some(i=>i.id==='cut'))pc.cutProne=1;
  const oc=oppCombat(f);
  const pr=G.promoter?PROMOTERS[G.promoter.id]:null;
  const rob=(o.title&&!o.title.defense&&!o.title.regional?.25:0)+(G.flags.persona==='villain'?.2:0)+(pr&&pr.shady>.3&&chance(.3)?.25:0);
  Sfx.init();
  const fight=new Fight({p:pc,o:oc,rounds:o.rounds,roundLen:Settings.roundLen,diff:G.diff,amateur:!!o.amateur,mods:o.mods||{},scout:n.scout,corner:TRAINERS[G.trainer].corner,trainerName:TRAINERS[G.trainer].name,
    cutman:G.staff.cutman,longCount:!!(o.title&&!o.title.regional&&!G.chapters.includes('longcount')),robbery:rob,tutorial:G.history.length===0,
    onEnd:res=>afterFight(o,res)});
  if(o.foughtHurt&&B().injuries.some(i=>i.id==='cut'))fight.p.cutProne=2;
  fight.mount();
}
function afterFight(o,res){
  if(res.longCount&&!G.chapters.includes('longcount')){G.chapters.push('longcount');news('Chapter: The Long Count. The referee gave you extra seconds on the canvas.','gold')}
  const sum=applyResult(o,res);
  UI.lastResult={o,res,sum};
  Save.write();
  UI.go('result');
}
SCR.result=()=>{
  const {o,res,sum}=UI.lastResult,f=G.world.f[o.oppId],b=B();
  const win=res.winner==='p',draw=res.winner==='draw';
  const big=win?'Victory':draw?'Draw':'Defeat';
  const mlong={KO:'Knockout',TKO:'Technical knockout',RTD:'Corner retirement',UD:'Unanimous decision',SD:'Split decision',MD:'Majority decision',DRAW:'Draw','SPLIT DRAW':'Split draw',DEC:'Decision'}[res.method]||res.method;
  const P=res.stats.p,O=res.stats.o;const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
  const cards=res.cards&&res.cards.length&&['UD','SD','MD','DRAW','SPLIT DRAW'].includes(res.method)?`<div class="card"><h3>Official scorecards</h3><div class="tblw"><table class="t"><tr><th>Judge</th><th class="r">${esc(b.last)}</th><th class="r">${esc(f.last)}</th></tr>${res.cards.map((c,i)=>`<tr><td>${['Judge A. Torres','Judge M. Klein','Judge S. Okafor'][i]}</td><td class="r">${c[0]}</td><td class="r">${c[1]}</td></tr>`).join('')}</table></div>${res.robbery?'<p class="bad" style="margin-top:6px">The crowd boos the decision. Ringside is calling it a robbery.</p>':''}</div>`:'';
  const cbx=`<div class="card"><h3>Punch stats</h3><div class="tblw"><table class="t cbx"><tr><th></th><th>${esc(b.last)}</th><th>${esc(f.last)}</th></tr>
    <tr><td>Total punches</td><td>${P.landed}/${P.thrown} (${pc(P.landed,P.thrown)})</td><td>${O.landed}/${O.thrown} (${pc(O.landed,O.thrown)})</td></tr>
    <tr><td>Jabs</td><td>${P.jabL??'–'}/${P.jabT??'–'}</td><td>${O.jabL??'–'}/${O.jabT??'–'}</td></tr>
    <tr><td>Power punches</td><td>${P.powL??'–'}/${P.powT??'–'}</td><td>${O.powL??'–'}/${O.powT??'–'}</td></tr>
    <tr><td>Body shots landed</td><td>${P.bodyL??'–'}</td><td>${O.bodyL??'–'}</td></tr>
    <tr><td>Knockdowns</td><td>${res.kdFor}</td><td>${res.kdAgainst}</td></tr>
    ${P.perfect!=null?`<tr><td>Perfect dodges</td><td>${P.perfect}</td><td>–</td></tr>`:''}</table></div></div>`;
  const mny=sum.moneyLines?`<div class="card"><h3>Payday</h3><div class="tblw"><table class="t">${sum.moneyLines.map(l=>`<tr><td>${esc(l[0])}</td><td class="r num ${l[1]<0?'bad':''}">${money(l[1])}</td></tr>`).join('')}<tr><td><b>Net</b></td><td class="r num"><b>${money(sum.money)}</b></td></tr></table></div></div>`:'';
  const lines=sum.lines.map(l=>`<div class="pill gold" style="white-space:normal">${esc(l)}</div>`).join('');
  return `<div class="scr"><div class="wrap" style="max-width:760px">
    <div class="hero"><div class="in" style="align-items:center;text-align:center">
      <div class="kicker">${esc(o.label)}</div><div class="bigtxt" style="font-size:clamp(44px,13vw,80px);color:${win?'var(--gold)':draw?'var(--canvas)':'var(--bad)'}">${big.toUpperCase()}</div>
      <p class="ui" style="font-size:20px;font-weight:700">${mlong}${['KO','TKO','RTD'].includes(res.method)?` · Round ${res.round}${res.method!=='RTD'?', '+res.time:''}`:''}</p>
      <p class="muted">vs ${esc(fullName(f))}</p>${res.note?`<p class="muted">${esc(res.note)}</p>`:''}<div class="col" style="gap:6px;align-items:center">${lines}</div></div></div>
    <div class="grid3">
      <div class="card"><span class="lbl">Experience</span><p class="rec">+${sum.xp} XP</p>${sum.levelUps?`<p class="goldt">Level up! Now level ${b.level}</p>`:''}</div>
      ${sum.pts!=null?`<div class="card"><span class="lbl">Ranking</span><p class="rec num ${sum.pts>=0?'good':'bad'}">${sum.pts>=0?'+':''}${sum.pts} pts</p>${sum.rank?`<p class="muted">#${sum.rank[0]} → #${sum.rank[1]} ${DIVS[b.div].short}</p>`:''}</div>`:''}
      <div class="card"><span class="lbl">Health</span><p class="num">Recovery: ${sum.recovery} week${sum.recovery!==1?'s':''}</p>${sum.injuries.length?`<p class="bad">${sum.injuries.map(i=>INJ[i].name).join(', ')}</p>`:''}<p class="muted num" style="font-size:13px">Long-term damage ${Math.round(b.damage)}/100</p></div>
    </div>
    ${cards}${cbx}${mny}
    <button class="btn primary wide" data-act="resultdone">Continue</button></div></div>`;
};
